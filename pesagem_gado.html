<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pesagem de Gado</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--brown:#4a3f38;--orange:#f47c3c;--bg:#faf5ee;--line:#e6dccf;--ok:#2e7d32;--red:#c62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#2b2420}
header{background:var(--brown);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header button{background:none;border:0;color:#fff;font-size:20px;padding:4px 8px;cursor:pointer}
#sync{font-size:12px;padding:3px 8px;border-radius:10px;background:#ffffff22}
#sync.off{background:var(--red)}#sync.ok{background:var(--ok)}
main{max-width:640px;margin:0 auto;padding:14px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;background:var(--orange);color:#fff;margin:10px 0}
.btn.sec{background:var(--brown)}.btn.ghost{background:#fff;color:var(--brown);border:2px solid var(--brown)}
.btn.wa{background:#25d366}.btn:disabled{opacity:.5}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--brown)}
input{width:100%;padding:13px;font-size:17px;border:2px solid var(--line);border-radius:10px;background:#fff}
input:focus{outline:none;border-color:var(--orange)}
.big{font-size:30px;text-align:center;font-weight:700}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;padding:12px;font-size:16px;font-weight:700;border:2px solid var(--brown);background:#fff;color:var(--brown);border-radius:10px}
.seg button.on{background:var(--brown);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--brown);color:#fff;padding:8px 4px;font-size:12px}
td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
tr:nth-child(even) td{background:#fff4ec}
td input{padding:6px;font-size:14px;text-align:center;border-width:1px}
.x{background:none;border:0;color:var(--red);font-size:18px;cursor:pointer}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font-size:17px;color:var(--brown)}.sum span{font-size:11px;color:#7a6c60}
.lote{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.muted{color:#7a6c60;font-size:13px}.prev{text-align:center;color:var(--brown);min-height:22px;font-weight:600}
.warn{background:#fff3cd;border:1px solid #ffe08a;padding:10px;border-radius:10px;font-size:13px;margin:10px 0}
</style>
</head>
<body>
<header>
  <button id="back" onclick="goBack()" style="display:none">←</button>
  <h1 id="title">🐂 Pesagem de Gado</h1>
  <span id="sync" class="off">…</span>
  <button onclick="setUrl()" title="Configurar planilha">⚙</button>
</header>
<main id="app"></main>

<script>
/* ====== CONFIG ====== */
const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz8GPIAGhhnGR_dptuKIMk-mLFzJNn91SzvbtqE2jjlfyOPJoihDt4vnK3dcYm7dDka/exec'; // cole aqui a URL /exec do Apps Script (ou use o botão ⚙)
const ARROBA_KG = 30;          // 1 @ de peso vivo = 30 kg (conforme a tabela de referência)

/* ====== TABELA PADRÃO (ref. 13/10 - Mato Grosso) — preço por @ ====== */
const DEFAULT_PRECOS = {
 M:[[450,399.90],[435,402.21],[420,405.22],[405,408.33],[390,411.64],[375,416.71],[360,422.52],[345,427.84],[330,435.51],[315,444.99],[300,452.61],[285,461.24],[270,472.31],[255,481.08],[240,489.08],[225,499.42],[210,509.26],[195,519.09],[180,531.34]],
 F:[[405,326.75],[390,334.19],[375,337.72],[360,341.07],[345,345.21],[330,350.30],[315,355.42],[300,361.43],[285,368.58],[270,375.50],[255,383.46],[240,392.76],[225,401.32],[210,410.59],[195,421.47],[180,432.52],[165,445.10]]
};

/* ====== ESTADO ====== */
const $=id=>document.getElementById(id);
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let SCRIPT_URL=localStorage.getItem('gc_url')||DEFAULT_SCRIPT_URL;
let precos=LS('gc_precos',null)||toPrecos(DEFAULT_PRECOS);
let lotes=LS('gc_lotes',[]);
let lote=null, pesos=[], sexo=LS('gc_sexo','M'), view='home', stack=[];
let queue=LS('gc_queue',[]), busy=false;

function toPrecos(d){const o={};for(const s in d)o[s]=d[s].map(r=>({peso:r[0],arroba:r[1]}));return o}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=(v,d=1)=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=t=>new Date(t).toLocaleDateString('pt-BR')+' '+new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const code=l=>'#'+l.id.slice(-4).toUpperCase();

/* ====== CÁLCULO ====== */
function calc(s,peso){
  const t=(precos[s]||[]).slice().sort((a,b)=>a.peso-b.peso);
  if(!t.length)return{arroba:0,valor:0,fora:true};
  let a,fora=false;
  if(peso<=t[0].peso){a=t[0].arroba;fora=peso<t[0].peso}
  else if(peso>=t[t.length-1].peso){a=t[t.length-1].arroba;fora=peso>t[t.length-1].peso}
  else for(let i=0;i<t.length-1;i++){
    if(peso>=t[i].peso&&peso<=t[i+1].peso){
      const f=(peso-t[i].peso)/(t[i+1].peso-t[i].peso);
      a=t[i].arroba+f*(t[i+1].arroba-t[i].arroba);break}
  }
  a=Math.round(a*100)/100;
  return{arroba:a,valor:Math.round(peso/ARROBA_KG*a*100)/100,fora};
}

/* ====== API / FILA ====== */
async function api(action,p={}){
  if(!SCRIPT_URL)throw new Error('sem url');
  const r=await fetch(SCRIPT_URL+'?'+new URLSearchParams({action,...p}));
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'erro');
  return j;
}
function enqueue(a,p){queue.push({a,p});SV('gc_queue',queue);flush()}
async function flush(){
  if(busy)return;busy=true;setSync();
  try{
    while(queue.length){
      await api(queue[0].a,queue[0].p);
      queue.shift();SV('gc_queue',queue);setSync();
    }
  }catch(e){}
  busy=false;setSync();
}
function setSync(){
  const s=$('sync');
  if(!SCRIPT_URL){s.className='off';s.textContent='sem planilha';return}
  if(queue.length){s.className='off';s.textContent='⟳ '+queue.length+' pendente'+(queue.length>1?'s':'');return}
  s.className='ok';s.textContent='✓ sincronizado';
}
setInterval(()=>{if(queue.length)flush()},15000);
function setUrl(){
  const u=prompt('Cole a URL do Apps Script (termina em /exec):',SCRIPT_URL);
  if(u===null)return;
  SCRIPT_URL=u.trim();localStorage.setItem('gc_url',SCRIPT_URL);
  if(SCRIPT_URL)api('ping').then(()=>{alert('Planilha conectada ✓');flush();syncDown()}).catch(()=>alert('Não consegui conectar. Verifique a URL e a implantação (acesso: Qualquer pessoa).'));
  setSync();render();
}
async function syncDown(){
  if(!SCRIPT_URL)return;
  try{
    const r=await api('lotes');
    const m=new Map(lotes.map(l=>[l.id,l]));
    r.data.forEach(l=>m.set(l.id,{id:l.id,t:Date.parse(l.criado)||0,prop:l.prop,tel:l.tel}));
    lotes=[...m.values()].sort((a,b)=>b.t-a.t);SV('gc_lotes',lotes);
    const p=await api('precos');
    if(p.data.length){precos={M:[],F:[]};p.data.forEach(x=>precos[x.sexo]&&precos[x.sexo].push({peso:x.peso,arroba:x.arroba}));SV('gc_precos',precos)}
    if(view==='buscar')render();
  }catch(e){}
}

/* ====== NAVEGAÇÃO ====== */
function go(v,push=true){if(push)stack.push(view);view=v;render()}
function goBack(){view=stack.pop()||'home';render()}

function render(){
  $('back').style.display=view==='home'?'none':'block';
  const T={home:'🐂 Pesagem de Gado',novo:'Novo lote',buscar:'Buscar lote',lote:lote?lote.prop+' '+code(lote):'',relatorio:'Relatório',precos:'Planilha de preços'};
  $('title').textContent=T[view];
  const a=$('app');
  if(view==='home'){
    a.innerHTML=`${SCRIPT_URL?'':'<div class="warn">⚠ Planilha não conectada. Toque em ⚙ e cole a URL do Apps Script. Enquanto isso os dados ficam só neste aparelho.</div>'}
    <button class="btn" onclick="go('novo')">➕ Cadastrar novo lote</button>
    <button class="btn sec" onclick="go('buscar')">🔎 Buscar lote cadastrado</button>
    <button class="btn ghost" onclick="go('precos')">📋 Planilha de preço de rebanho</button>`;
  }else if(view==='novo'){
    a.innerHTML=`<div class="card"><label>Nome do proprietário</label><input id="n_prop" autocomplete="off">
    <label>Telefone (com DDD)</label><input id="n_tel" inputmode="tel" placeholder="(65) 99999-9999"></div>
    <button class="btn" onclick="criarLote()">Salvar e iniciar pesagem</button>`;
    setTimeout(()=>$('n_prop').focus(),50);
  }else if(view==='buscar'){
    a.innerHTML=`<input id="q" placeholder="Buscar por nome ou telefone" oninput="listaLotes()"><div id="lista"></div>`;listaLotes();
  }else if(view==='lote')renderLote();
  else if(view==='relatorio')renderRel();
  else if(view==='precos')renderPrecos();
}

/* ====== LOTES ====== */
function criarLote(){
  const prop=$('n_prop').value.trim(),tel=$('n_tel').value.trim();
  if(!prop){alert('Informe o nome do proprietário');return}
  const l={id:uid(),t:Date.now(),prop,tel};
  lotes.unshift(l);SV('gc_lotes',lotes);
  enqueue('addLote',{id:l.id,criado:new Date(l.t).toISOString(),prop,tel});
  abrirLote(l.id,false);
}
function listaLotes(){
  const q=($('q')?.value||'').toLowerCase();
  const r=lotes.filter(l=>(l.prop+' '+l.tel).toLowerCase().includes(q));
  $('lista').innerHTML=r.length?r.map(l=>`<div class="card lote" onclick="abrirLote('${l.id}')"><div><b>${esc(l.prop)}</b><div class="muted">${esc(l.tel)} · ${fmtDate(l.t)}</div></div><span>${code(l)} ›</span></div>`).join(''):'<p class="muted" style="text-align:center">Nenhum lote encontrado</p>';
}
async function abrirLote(id,push=true){
  lote=lotes.find(l=>l.id===id);
  pesos=LS('gc_pesos_'+id,[]);
  if(view==='novo'){stack.pop();view='lote'}else go('lote',push);
  render();
  if(!SCRIPT_URL)return;
  try{
    await flush();
    const r=await api('pesos',{lote:id});
    const m=new Map();
    r.data.forEach(x=>m.set(x.id,{id:x.id,t:Date.parse(x.criado)||0,sexo:x.sexo,peso:x.peso,arroba:x.arroba,valor:x.valor}));
    queue.filter(o=>o.a==='addPeso'&&o.p.lote===id).forEach(o=>{if(!m.has(o.p.id)){const x=pesos.find(z=>z.id===o.p.id);if(x)m.set(x.id,x)}});
    pesos=[...m.values()].sort((a,b)=>a.t-b.t);SV('gc_pesos_'+id,pesos);
    if(view==='lote'&&lote&&lote.id===id)renderLote(true);
  }catch(e){}
}

/* ====== PESAGEM ====== */
function renderLote(keepFocus){
  const v=keepFocus&&$('peso')?$('peso').value:'';
  $('app').innerHTML=`<div class="card">
    <div class="seg"><button id="sM" class="${sexo==='M'?'on':''}" onclick="setSexo('M')">♂ Macho</button><button id="sF" class="${sexo==='F'?'on':''}" onclick="setSexo('F')">♀ Fêmea</button></div>
    <input id="peso" class="big" inputmode="decimal" placeholder="Peso (kg)" value="${esc(v)}" oninput="preview()" onkeydown="if(event.key==='Enter')salvarPeso()">
    <div class="prev" id="prev"></div>
    <button class="btn" onclick="salvarPeso()">Salvar peso e próximo</button>
  </div>
  <div class="card sum" id="sum"></div>
  <div class="card"><b>Pesos registrados</b><div id="lst"></div></div>
  <button class="btn sec" onclick="go('relatorio')" ${pesos.length?'':'disabled'}>📄 Gerar relatório</button>`;
  lista();preview();if(!keepFocus||v)$('peso').focus();
}
function setSexo(s){sexo=s;SV('gc_sexo',s);$('sM').className=s==='M'?'on':'';$('sF').className=s==='F'?'on':'';preview()}
const parsePeso=s=>parseFloat(String(s).replace(',','.'));
function preview(){
  const p=parsePeso($('peso').value);
  if(!(p>0)){$('prev').textContent='';return}
  const c=calc(sexo,p);
  $('prev').textContent=`${brl(c.valor)}  ·  @ ${brl(c.arroba)}${c.fora?'  (fora da tabela)':''}`;
}
function salvarPeso(){
  const p=parsePeso($('peso').value);
  if(!(p>0)||p>1500){alert('Informe um peso válido (kg)');return}
  const c=calc(sexo,p);
  const x={id:uid(),t:Date.now(),sexo,peso:p,arroba:c.arroba,valor:c.valor};
  pesos.push(x);SV('gc_pesos_'+lote.id,pesos);
  enqueue('addPeso',{id:x.id,lote:lote.id,prop:lote.prop,criado:new Date(x.t).toISOString(),sexo,peso:p,arroba:c.arroba,valor:c.valor});
  $('peso').value='';lista();preview();$('peso').focus();
  const b=document.querySelector('button.sec');if(b)b.disabled=false;
}
function lista(){
  const tp=pesos.reduce((s,x)=>s+x.peso,0),tv=pesos.reduce((s,x)=>s+x.valor,0);
  $('sum').innerHTML=`<div><b>${pesos.length}</b><span>cabeças</span></div><div><b>${num(tp)} kg</b><span>peso total</span></div><div><b>${brl(tv)}</b><span>valor total</span></div>`;
  $('lst').innerHTML=pesos.length?`<table><tr><th>#</th><th></th><th>Peso</th><th>Valor</th><th></th></tr>${pesos.map((x,i)=>`<tr><td>${i+1}</td><td>${x.sexo==='M'?'♂':'♀'}</td><td>${num(x.peso)} kg</td><td>${brl(x.valor)}</td><td><button class="x" onclick="delPeso('${x.id}')">✕</button></td></tr>`).reverse().join('')}</table>`:'<p class="muted" style="text-align:center">Nenhum peso registrado</p>';
}
function delPeso(id){
  if(!confirm('Excluir este peso?'))return;
  pesos=pesos.filter(x=>x.id!==id);SV('gc_pesos_'+lote.id,pesos);
  const i=queue.findIndex(o=>o.a==='addPeso'&&o.p.id===id);
  if(i>=0){queue.splice(i,1);SV('gc_queue',queue)}else enqueue('delPeso',{id});
  lista();
  const b=document.querySelector('button.sec');if(b)b.disabled=!pesos.length;
}

/* ====== RELATÓRIO ====== */
function sorted(){return pesos.slice().sort((a,b)=>a.peso-b.peso)}
function renderRel(){
  const s=sorted(),tp=s.reduce((a,x)=>a+x.peso,0),tv=s.reduce((a,x)=>a+x.valor,0);
  $('app').innerHTML=`<div class="card"><b>${esc(lote.prop)}</b> <span class="muted">${code(lote)}</span><div class="muted">${esc(lote.tel)} · ${new Date().toLocaleDateString('pt-BR')}</div></div>
  <div class="card sum"><div><b>${s.length}</b><span>cabeças</span></div><div><b>${num(tp)} kg</b><span>peso total</span></div><div><b>${brl(tv)}</b><span>valor total</span></div></div>
  <div class="card"><table><tr><th>#</th><th></th><th>Peso</th><th>@</th><th>Valor</th></tr>${s.map((x,i)=>`<tr><td>${i+1}</td><td>${x.sexo==='M'?'♂':'♀'}</td><td>${num(x.peso)}</td><td>${num(x.arroba,2)}</td><td>${brl(x.valor)}</td></tr>`).join('')}
  <tr><td colspan="2"><b>Total</b></td><td><b>${num(tp)}</b></td><td></td><td><b>${brl(tv)}</b></td></tr></table></div>
  <button class="btn" onclick="baixarPdf()">⬇ Exportar PDF</button>
  <button class="btn wa" onclick="enviarWa()">📲 Enviar por WhatsApp</button>`;
}
function makePdf(){
  const {jsPDF}=window.jspdf,d=new jsPDF(),s=sorted();
  const tp=s.reduce((a,x)=>a+x.peso,0),tv=s.reduce((a,x)=>a+x.valor,0);
  d.setFillColor(74,63,56);d.rect(0,0,210,30,'F');
  d.setTextColor(255);d.setFontSize(18);d.text('Relatório de Pesagem',14,14);
  d.setFontSize(10);d.text('Lote '+code(lote)+'  ·  '+new Date().toLocaleDateString('pt-BR'),14,23);
  d.setTextColor(40);d.setFontSize(12);
  d.text('Proprietário: '+lote.prop,14,40);d.text('Telefone: '+(lote.tel||'-'),14,47);
  d.text('Cabeças: '+s.length+'   Peso total: '+num(tp)+' kg   Média: '+num(s.length?tp/s.length:0)+' kg',14,55);
  d.autoTable({startY:61,head:[['#','Sexo','Peso (kg)','Preço/@','Valor']],
    body:s.map((x,i)=>[i+1,x.sexo==='M'?'Macho':'Fêmea',num(x.peso),brl(x.arroba),brl(x.valor)]),
    foot:[['','Total',num(tp),'',brl(tv)]],
    headStyles:{fillColor:[74,63,56]},footStyles:{fillColor:[244,124,60],textColor:255},
    alternateRowStyles:{fillColor:[255,244,236]},styles:{halign:'center',fontSize:10}});
  return d;
}
function fileName(){return 'pesagem_'+lote.prop.replace(/[^\w]+/g,'_')+'_'+code(lote).slice(1)+'.pdf'}
function baixarPdf(){makePdf().save(fileName())}
async function enviarWa(){
  const d=makePdf(),blob=d.output('blob'),name=fileName();
  const s=sorted(),tp=s.reduce((a,x)=>a+x.peso,0),tv=s.reduce((a,x)=>a+x.valor,0);
  const txt=`Olá ${lote.prop}! Segue o relatório de pesagem do seu lote.\n🐂 ${s.length} cabeças · ${num(tp)} kg\n💰 Valor total: ${brl(tv)}`;
  const file=new File([blob],name,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],text:txt});return}catch(e){if(e.name==='AbortError')return}
  }
  d.save(name);
  let t=(lote.tel||'').replace(/\D/g,'');if(t&&t.length<=11)t='55'+t;
  window.open('https://wa.me/'+t+'?text='+encodeURIComponent(txt+'\n\n(PDF baixado — anexe o arquivo na conversa)'),'_blank');
}

/* ====== PLANILHA DE PREÇOS ====== */
let pSexo='M';
function renderPrecos(){
  const t=(precos[pSexo]||[]).slice().sort((a,b)=>b.peso-a.peso);
  $('app').innerHTML=`<div class="seg"><button class="${pSexo==='M'?'on':''}" onclick="pSexo='M';renderPrecos()">♂ Machos</button><button class="${pSexo==='F'?'on':''}" onclick="pSexo='F';renderPrecos()">♀ Fêmeas</button></div>
  <p class="muted">Edite o peso e o preço por @. Preço/kg e preço/cabeça são calculados. Pesos entre as faixas são interpolados.</p>
  <div class="card"><table><tr><th>Peso kg</th><th>@</th><th>R$/@</th><th>R$/kg</th><th>R$/cab.</th><th></th></tr>
  ${t.map((r,i)=>`<tr><td><input value="${r.peso}" inputmode="decimal" onchange="editP(${i},'peso',this.value)"></td><td>${num(r.peso/ARROBA_KG,1)}</td><td><input value="${r.arroba}" inputmode="decimal" onchange="editP(${i},'arroba',this.value)"></td><td>${num(r.arroba/ARROBA_KG,2)}</td><td>${num(r.peso/ARROBA_KG*r.arroba,2)}</td><td><button class="x" onclick="delP(${i})">✕</button></td></tr>`).join('')}</table></div>
  <button class="btn ghost" onclick="addP()">➕ Adicionar faixa</button>
  <button class="btn" onclick="salvarPrecos()">💾 Salvar tabela</button>
  <button class="btn ghost" onclick="resetP()">Restaurar tabela original (13/10)</button>`;
}
function sortedDesc(){return precos[pSexo].sort((a,b)=>b.peso-a.peso)}
function editP(i,k,v){const n=parseFloat(String(v).replace(',','.'));if(!(n>0)){renderPrecos();return}sortedDesc()[i][k]=n;renderPrecos()}
function delP(i){if(precos[pSexo].length<=2){alert('Mantenha ao menos 2 faixas');return}sortedDesc().splice(i,1);renderPrecos()}
function addP(){const t=sortedDesc();t.push({peso:(t[t.length-1]?.peso||200)-15,arroba:t[t.length-1]?.arroba||400});renderPrecos()}

function salvarPrecos(){
  SV('gc_precos',precos);
  const data=['M','F'].flatMap(s=>precos[s].map(r=>s+':'+r.peso+':'+r.arroba)).join(';');
